[project]
name = "kiba-api"
version = "0.1.0"
description = "FastAPI backend foundation for Kiba"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0",
  "uvicorn[standard]>=0.35.0,<1.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.0.0,<3.0",
  "pytest>=8.4.0,<10.0",
  "ruff>=0.12.0,<1.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
