name: ${COMPOSE_PROJECT_NAME:-kiba-production}

x-logging: &production-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *production-logging
    environment:
      POSTGRES_DB: ${KIBA_POSTGRES_DB:?required}
      POSTGRES_USER: ${KIBA_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${KIBA_POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    logging: *production-logging
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: production
      KIBA_DATABASE_URL: ${KIBA_DATABASE_URL:?required}
      KIBA_PUBLIC_BASE_URL: ${KIBA_PUBLIC_BASE_URL:?required}
      KIBA_TRUSTED_HOSTS: ${KIBA_TRUSTED_HOSTS:?required}
      KIBA_CSRF_TRUSTED_ORIGINS: ${KIBA_CSRF_TRUSTED_ORIGINS:?required}
      KIBA_AUTH_COOKIE_SECURE: "true"
      KIBA_EMAIL_MODE: smtp
      KIBA_SMTP_HOST: ${KIBA_SMTP_HOST:?required}
      KIBA_SMTP_PORT: ${KIBA_SMTP_PORT:-587}
      KIBA_SMTP_USERNAME: ${KIBA_SMTP_USERNAME:?required}
      KIBA_SMTP_PASSWORD: ${KIBA_SMTP_PASSWORD:?required}
      KIBA_SMTP_FROM: ${KIBA_SMTP_FROM:?required}
      KIBA_SMTP_STARTTLS: ${KIBA_SMTP_STARTTLS:-true}
      KIBA_LOG_JSON: "true"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/ready', headers={'Host': os.environ['KIBA_TRUSTED_HOSTS'].split(',')[0]}); urllib.request.urlopen(request, timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - app
      - data

  kiba-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    logging: *production-logging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      app:
      ingress:
        aliases:
          - kiba-frontend

volumes:
  postgres-data:

networks:
  app:
  data:
    internal: true
  ingress:
    external: true
    name: ${KIBA_INGRESS_NETWORK:-huskytracking_proxy}
