services:
  backend:
    build:
      context: ./backend
    command: uvicorn kiba_api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    command: npm start -- --host 0.0.0.0 --port 4200 --poll 1000
    depends_on:
      - backend
    environment:
      KIBA_API_PROXY_TARGET: http://backend:8000
    ports:
      - "14200:4200"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  frontend-node-modules:
