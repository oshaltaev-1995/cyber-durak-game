<header class="app-header">
  <a class="brand" routerLink="/" aria-label="Kiba — главная">
    <span class="brand-mark" aria-hidden="true">K</span>
    <span>KIBA</span>
  </a>
  <nav aria-label="Основная навигация">
    <a routerLink="/play" routerLinkActive="active">Играть</a>
    <a routerLink="/tutorial" routerLinkActive="active">Обучение</a>
    <a routerLink="/rules" routerLinkActive="active">Правила</a>
    @if (auth.currentUser(); as user) {
      <a
        class="account-link"
        [class.frame-level-2]="profile.currentLoadout().profile_frame_code === 'LEVEL_2_FRAME'"
        [class.frame-winner]="profile.currentLoadout().profile_frame_code === 'WINNER_FRAME'"
        routerLink="/profile"
        routerLinkActive="active"
      >
        {{ user.display_name }}
      </a>
    } @else {
      <a class="account-link" routerLink="/login" routerLinkActive="active">Войти</a>
    }
  </nav>
</header>
<router-outlet />
