<main class="auth-card" aria-labelledby="forgot-title">
  <span class="kicker">{{ i18n.t('auth.security') }}</span>
  <h1 id="forgot-title">{{ i18n.t('auth.forgotTitle') }}</h1>
  @if (submitted()) {
    <p class="success" role="status">
      {{ i18n.t('auth.forgotGeneric') }}
    </p>
    <a class="secondary-action" routerLink="/login">{{ i18n.t('auth.returnLogin') }}</a>
  } @else {
    <p class="intro">{{ i18n.t('auth.forgotPrivacy') }}</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Email <input type="email" formControlName="email" autocomplete="email" /></label>
      @if (error(); as message) {
        <p class="error" role="alert">{{ message }}</p>
      }
      <div class="form-actions">
        <button type="submit" [disabled]="pending()">
          {{ i18n.t(pending() ? 'auth.sending' : 'auth.sendLink') }}
        </button>
        <a class="secondary-action" routerLink="/login">{{ i18n.t('common.back') }}</a>
      </div>
    </form>
  }
</main>
