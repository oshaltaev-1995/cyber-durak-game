<main class="auth-card" aria-labelledby="forgot-title">
  <span class="kicker">Безопасность аккаунта</span>
  <h1 id="forgot-title">Восстановить пароль</h1>
  @if (submitted()) {
    <p class="success" role="status">
      Если аккаунт может получить письмо, инструкции уже отправлены.
    </p>
    <a class="secondary-action" routerLink="/login">Вернуться ко входу</a>
  } @else {
    <p class="intro">Введите подтверждённый email. Ответ одинаков для всех адресов.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Email <input type="email" formControlName="email" autocomplete="email" /></label>
      @if (error(); as message) {
        <p class="error" role="alert">{{ message }}</p>
      }
      <div class="form-actions">
        <button type="submit" [disabled]="pending()">
          {{ pending() ? 'Отправляем…' : 'Отправить ссылку' }}
        </button>
        <a class="secondary-action" routerLink="/login">Назад</a>
      </div>
    </form>
  }
</main>
