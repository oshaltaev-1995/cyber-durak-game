<main class="auth-card" aria-labelledby="login-title">
  <span class="kicker">Необязательный аккаунт</span>
  <h1 id="login-title">Войти</h1>
  <p class="intro">Играйте как гость или войдите, чтобы сохранить личность игрока.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label>
      Пароль
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }
    <div class="form-actions">
      <button type="submit" [disabled]="pending()">{{ pending() ? 'Входим…' : 'Войти' }}</button>
      <a class="secondary-action" routerLink="/register">Создать аккаунт</a>
      <a class="secondary-action" routerLink="/forgot-password">Забыли пароль?</a>
      <a class="secondary-action" routerLink="/play">Играть без входа</a>
    </div>
  </form>
</main>
