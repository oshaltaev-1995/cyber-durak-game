<main class="auth-card" aria-labelledby="login-title">
  <span class="kicker">{{ i18n.t('auth.optional') }}</span>
  <h1 id="login-title">{{ i18n.t('auth.login') }}</h1>
  <p class="intro">{{ i18n.t('auth.loginIntro') }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label>
      {{ i18n.t('auth.password') }}
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }
    <div class="form-actions">
      <button type="submit" [disabled]="pending()">
        {{ i18n.t(pending() ? 'auth.loggingIn' : 'auth.login') }}
      </button>
      <a class="secondary-action" routerLink="/register">{{ i18n.t('auth.register') }}</a>
      <a class="secondary-action" routerLink="/forgot-password">{{ i18n.t('auth.forgot') }}</a>
      <a class="secondary-action" routerLink="/play">{{ i18n.t('auth.playGuest') }}</a>
    </div>
  </form>
</main>
