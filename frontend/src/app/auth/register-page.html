<main class="auth-card" aria-labelledby="register-title">
  <span class="kicker">{{ i18n.t('auth.playerProfile') }}</span>
  <h1 id="register-title">{{ i18n.t('auth.register') }}</h1>
  <p class="intro">{{ i18n.t('auth.registerIntro') }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label>
      {{ i18n.t('auth.displayName') }}
      <input type="text" formControlName="display_name" autocomplete="nickname" maxlength="50" />
    </label>
    <label>
      {{ i18n.t('auth.password') }}
      <input
        type="password"
        formControlName="password"
        autocomplete="new-password"
        minlength="8"
        maxlength="128"
        aria-describedby="password-help"
      />
      <small id="password-help">{{ i18n.t('auth.passwordHelp') }}</small>
    </label>
    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }
    <div class="form-actions">
      <button type="submit" [disabled]="pending()">
        {{ i18n.t(pending() ? 'auth.registering' : 'auth.register') }}
      </button>
      <a class="secondary-action" routerLink="/login">{{ i18n.t('auth.alreadyAccount') }}</a>
      <a class="secondary-action" routerLink="/play">{{ i18n.t('auth.playWithoutRegister') }}</a>
    </div>
  </form>
</main>
