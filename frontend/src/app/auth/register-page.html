<main class="auth-card" aria-labelledby="register-title">
  <span class="kicker">Профиль игрока</span>
  <h1 id="register-title">Создать аккаунт</h1>
  <p class="intro">
    Аккаунт нужен только для сохранения статистики и будущих наград. Играть можно и без регистрации.
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label>
      Имя игрока
      <input type="text" formControlName="display_name" autocomplete="nickname" maxlength="50" />
    </label>
    <label>
      Пароль
      <input
        type="password"
        formControlName="password"
        autocomplete="new-password"
        minlength="8"
        maxlength="128"
        aria-describedby="password-help"
      />
      <small id="password-help">Минимум 8 символов.</small>
    </label>
    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }
    <div class="form-actions">
      <button type="submit" [disabled]="pending()">
        {{ pending() ? 'Создаём…' : 'Создать аккаунт' }}
      </button>
      <a class="secondary-action" routerLink="/login">Уже есть аккаунт</a>
      <a class="secondary-action" routerLink="/play">Играть без регистрации</a>
    </div>
  </form>
</main>
