<main id="main-content" class="auth-card" tabindex="-1" aria-labelledby="reset-title">
  <span class="kicker">{{ i18n.t('auth.security') }}</span>
  <h1 id="reset-title">{{ i18n.t('auth.resetTitle') }}</h1>
  @if (complete()) {
    <p class="success" role="status">{{ i18n.t('auth.resetAllSessions') }}</p>
    <a class="secondary-action" routerLink="/login">{{ i18n.t('auth.login') }}</a>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        {{ i18n.t('auth.newPassword') }}
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>
      <label>
        {{ i18n.t('auth.confirmPassword') }}
        <input type="password" formControlName="confirm" autocomplete="new-password" />
      </label>
      @if (error(); as message) {
        <p class="error" role="alert">{{ message }}</p>
      }
      <div class="form-actions">
        <button type="submit" [disabled]="pending() || !token">
          {{ i18n.t(pending() ? 'common.saving' : 'auth.savePassword') }}
        </button>
        <a class="secondary-action" routerLink="/login">{{ i18n.t('common.back') }}</a>
      </div>
    </form>
  }
</main>
