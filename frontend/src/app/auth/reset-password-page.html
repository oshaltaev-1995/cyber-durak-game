<main class="auth-card" aria-labelledby="reset-title">
  <span class="kicker">Безопасность аккаунта</span>
  <h1 id="reset-title">Новый пароль</h1>
  @if (complete()) {
    <p class="success" role="status">Пароль изменён. Все прежние сессии завершены.</p>
    <a class="secondary-action" routerLink="/login">Войти</a>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Новый пароль
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>
      <label>
        Повторите пароль
        <input type="password" formControlName="confirm" autocomplete="new-password" />
      </label>
      @if (error(); as message) {
        <p class="error" role="alert">{{ message }}</p>
      }
      <div class="form-actions">
        <button type="submit" [disabled]="pending() || !token">
          {{ pending() ? 'Сохраняем…' : 'Сохранить пароль' }}
        </button>
        <a class="secondary-action" routerLink="/login">Назад</a>
      </div>
    </form>
  }
</main>
