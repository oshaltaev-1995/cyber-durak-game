<main id="main-content" class="auth-card" tabindex="-1" aria-labelledby="verify-title">
  <span class="kicker">{{ i18n.t('auth.security') }}</span>
  <h1 id="verify-title">{{ i18n.t('auth.verifyTitle') }}</h1>
  @if (pending()) {
    <p role="status">{{ i18n.t('auth.verifying') }}</p>
  } @else if (verified()) {
    <p class="success" role="status">{{ i18n.t('auth.verified') }}</p>
    <a class="secondary-action" routerLink="/profile">{{ i18n.t('game.openProfile') }}</a>
  } @else if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
    <a class="secondary-action" routerLink="/profile">{{ i18n.t('game.openProfile') }}</a>
  }
</main>
