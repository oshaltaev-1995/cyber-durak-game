<ng-template #cardFace>
  <span class="corner" [class]="colorClass()">
    <strong>{{ card().rank }}</strong>
    <span>{{ suitSymbol() }}</span>
  </span>
  <span class="suit" [class]="colorClass()" aria-hidden="true">{{ suitSymbol() }}</span>
  <span class="value">{{ card().effective_value }}</span>
  @if (card().is_trump) {
    <span class="trump-badge">{{ i18n.t('game.trump') }}</span>
  }
</ng-template>

@if (selectable()) {
  <button
    type="button"
    class="playing-card"
    [class.selected]="selected()"
    [class.suggested]="suggested()"
    [class.compact]="compact()"
    [disabled]="disabled()"
    [attr.aria-label]="accessibleLabel()"
    [attr.aria-pressed]="selected()"
    (click)="select()"
  >
    <ng-container [ngTemplateOutlet]="cardFace" />
    @if (suggested()) {
      <span class="suggested-badge">{{ i18n.t('hints.suggested') }}</span>
    }
  </button>
} @else {
  <div
    class="playing-card display-only"
    [class.compact]="compact()"
    role="img"
    [attr.aria-label]="accessibleLabel()"
  >
    <ng-container [ngTemplateOutlet]="cardFace" />
  </div>
}
