<section
  class="seat-map"
  [class.has-side-seats]="hasSideSeats()"
  [class.has-top-seat]="hasTopSeat()"
  [class.side-only]="hasSideSeats() && !hasTopSeat()"
  [class.terminal]="terminal()"
>
  @for (seat of seats(); track seat.id) {
    <app-table-seat
      [seat]="seat"
      [terminal]="terminal()"
      [class.seat-top]="seat.position === 'top'"
      [class.seat-left]="seat.position === 'left'"
      [class.seat-right]="seat.position === 'right'"
    />
  }
  @if (hasSideSeats()) {
    <div class="table-center-space" aria-hidden="true"></div>
  }
</section>
