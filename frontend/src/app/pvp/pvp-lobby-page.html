<main class="pvp-lobby">
  <section class="lobby-card" aria-labelledby="pvp-title">
    <span class="eyebrow">{{ i18n.t('pvp.privateGame') }}</span>
    <h1 id="pvp-title">{{ i18n.t('pvp.title') }}</h1>
    <p>{{ i18n.t('pvp.registrationFree') }}</p>

    @if (auth.currentUser(); as user) {
      <div class="identity-note">
        {{ i18n.t('pvp.enterAs') }} <strong>{{ user.display_name }}</strong>
      </div>
    } @else {
      <label>
        <span>{{ i18n.t('pvp.nickname') }}</span>
        <input
          type="text"
          maxlength="24"
          autocomplete="nickname"
          [ngModel]="nickname()"
          (ngModelChange)="nickname.set($event)"
          [placeholder]="i18n.t('pvp.nicknamePlaceholder')"
        />
      </label>
    }
    <button class="primary" type="button" [disabled]="pending()" (click)="createRoom()">
      {{ i18n.t(pending() ? 'pvp.creating' : 'pvp.create') }}
    </button>

    <div class="divider">
      <span>{{ i18n.t('pvp.or') }}</span>
    </div>
    <form (ngSubmit)="openInvite()">
      <label>
        <span>{{ i18n.t('pvp.roomCode') }}</span>
        <input
          type="text"
          autocomplete="off"
          [ngModel]="inviteCode()"
          (ngModelChange)="inviteCode.set($event)"
          (blur)="roomCodeTouched.set(true)"
          name="inviteCode"
          placeholder="K7F9Q2"
          [attr.aria-invalid]="roomCodeInvalid()"
          [attr.aria-describedby]="roomCodeInvalid() ? 'room-code-error' : null"
        />
        @if (roomCodeInvalid()) {
          <small id="room-code-error" class="field-error" role="alert">{{
            i18n.t('pvp.enterRoomCode')
          }}</small>
        }
      </label>
      <button type="submit" [disabled]="pending() || inviteCode().trim() === ''">
        {{ i18n.t('pvp.joinByCode') }}
      </button>
    </form>
    @if (error(); as message) {
      <div class="error" role="alert">{{ message }}</div>
    }
    <a routerLink="/">{{ i18n.t('pvp.home') }}</a>
  </section>
</main>
